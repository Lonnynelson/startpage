<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">Girl wearing a uniform</title>
  <desc id="desc">Front view with shoulder patches, pins on the wearer's left pocket, a name tag on her right pocket, pants or a jumper, belt, sash, beret, black bow tie, and a burgundy scarf with a white slide. Each item has an editable ID. Transparent background.</desc>
  <!-- Left and right refer to the wearer, opposite the viewer. -->
