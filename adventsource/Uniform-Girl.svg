    <ellipse id="head" cx="240" cy="106" rx="43" ry="57"/>
    <ellipse cx="192" cy="112" rx="9" ry="15"/>
    <ellipse cx="288" cy="112" rx="9" ry="15"/>
    <path id="right-arm" d="M136 279 L171 290 L146 449 Q143 469 123 465 Q104 462 109 439 Z"/>
    <path id="left-arm" d="M344 279 L309 290 L334 449 Q337 469 357 465 Q376 462 371 439 Z"/>
  </g>
