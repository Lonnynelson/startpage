    <path d="M256 570 H296 L284 685 L278 725 H256 L259 685Z"/>
  </g>
  <g id="jumper" fill="#000000" display="none">
    <path d="M178 179 H210 L240 222 L270 179 H302 L317 205 L304 254 L308 405 L326 578 Q240 597 154 578 L172 405 L176 254 L163 205Z"/>
