<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the AdventSource Uniform Guide, NAD Atlas, and Pathfinder and Adventurer books, flags, and T-shirts.">
  <title>AdventSource</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: #162b35;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-position: center;
      background-size: cover;
      pointer-events: none;
    }
    .background-first {
      background-image: url("AdventSource_1.jpg");
    }
    .background-second {
      background-image: url("AdventSource_2.jpg");
      opacity: 0;
      animation: alternate-background 16s ease-in-out infinite;
    }
    @keyframes alternate-background {
      0%, 40%, 100% { opacity: 0; }
      50%, 90% { opacity: 1; }
    }
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(1.25rem, 5vw, 4rem);
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
      background: rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 2rem;
      font-size: clamp(2.25rem, 6vw, 4rem);
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
      width: min(100%, 960px);
      margin: 0 auto;
    }
    .menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      background: rgba(12, 29, 38, 0.6);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      color: #fff;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      transition: background 180ms ease, transform 180ms ease;
    }
    .menu a:hover {
      background: rgba(12, 29, 38, 0.75);
      transform: translateY(-3px);
    }
    .menu a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }
    .master-edit-link {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      z-index: 10;
    }
    .master-edit-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -2px;
    }
    .random-fun-link {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 0.65rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(12, 29, 38, 0.85);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .random-fun-link:hover {
      background: rgba(12, 29, 38, 1);
    }
    .random-fun-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    @media (max-width: 600px) {
      .menu {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .menu a {
        min-height: 120px;
        padding: 1.5rem;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .background-second {
        animation: none;
      }
      .menu a {
        transition: none;
      }
      .menu a:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <a class="master-edit-link" href="AS-master-edit.html" aria-label="Open master editor"></a>
  <div class="background background-first" aria-hidden="true"></div>
  <div class="background background-second" aria-hidden="true"></div>
  <main>
    <h1>AdventSource</h1>
    <nav class="menu" aria-label="AdventSource resources">
      <a href="adventsource.html">Uniform Guide</a>
      <a href="nad-atlas.html">NAD Atlas</a>
      <a href="PF-Books-Flags.html">Pathfinder Books and Flags</a>
      <a href="ADV-Books-Flags.html">Adventurer Books and Flags</a>
      <a href="PF-Shirts.html">Pathfinder T-Shirts</a>
      <a href="ADV-Shirts.html">Adventurer T-Shirts</a>
    </nav>
  </main>
  <a class="random-fun-link" href="../Random_Image.html" title="Open a random fun page" target="_blank">Random Fun</a>
  <script>
    const randomFunLink = document.querySelector('.random-fun-link');
    const funPages = [
      '../Random_Image.html',
      '../QR_Code_Gennerator.html',
      '../GuitarTuner.html',
      '../FreePhotos.html',
      '../POP/index.html',
      '../Earthquake.html',
      '../colorPalette.html'
    ];
    function chooseFunPage() {
      randomFunLink.href = funPages[Math.floor(Math.random() * funPages.length)];
    }
    chooseFunPage();
    randomFunLink.addEventListener('click', chooseFunPage);
    randomFunLink.addEventListener('auxclick', chooseFunPage);
  </script>
</body>
</html>
