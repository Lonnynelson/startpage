<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniforms</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      min-height: 100vh;
    }
    .column {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 1rem;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .buttons button {
      flex: 1 1 0;
      min-width: 5.5rem;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f4f4f4;
      cursor: pointer;
    }
    .buttons button.active {
      background: #333;
      color: #fff;
    }
    .division-buttons button {
      font-weight: 600;
    }
    .viewbox {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 70vh;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }
    .viewbox svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
    }
    .viewbox .part {
      cursor: pointer;
    }
    @media (hover: hover) {
      .viewbox .part:hover {
        fill: #940d0d;
      }
    }
    .viewbox .part.selected {
      stroke: #0a84ff;
      stroke-width: 3;
    }
    #details h2 {
      margin-top: 0;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 0.5rem;
        gap: 0.5rem;
      }
      .column {
        padding: 0.75rem;
      }
      .viewbox {
        height: 60vh;
      }
    }
    @media (max-width: 400px) {
      .buttons button {
        flex-basis: calc(50% - 0.25rem);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="column">
      <div class="buttons division-buttons" id="division-buttons" role="group" aria-label="Uniform program">
        <button data-division="pathfinder" class="active" aria-pressed="true">Pathfinder</button>
        <button data-division="adventurer" aria-pressed="false">Adventurer</button>
      </div>
      <div class="buttons uniform-buttons" id="uniform-buttons" role="group" aria-label="Uniform type">
        <button data-svg="Uniform-Woman.svg" data-shirt-color="white" class="active">Women's</button>
        <button data-svg="Uniform-Girl.svg" data-shirt-color="lightblue">Girls</button>
        <button data-svg="Uniform-Man.svg" data-shirt-color="white">Men's</button>
        <button data-svg="Uniform-Boy.svg" data-shirt-color="lightblue">Boys</button>
      </div>
      <div class="viewbox" id="uniform"></div>
    </div>
    <div class="column" id="details">
      <h2 id="details-title">Select a uniform item</h2>
      <p id="details-body">Click part of the uniform to see details here.</p>
    </div>
  </div>

  <script>
    // Keys are element ids in the SVG files; the most specific match wins.
    const parts = {
      'beret':                 { title: 'PF Beret',            body: { pathfinder: '', adventurer: '' } },
      'beret-badge':           { title: 'PF Beret Patch',      body: { pathfinder: '', adventurer: '' } },
      'right-shoulder-patch':  { title: 'PF Shoulder Patches', body: { pathfinder: '', adventurer: '' } },
      'left-shoulder-patch':   { title: 'Shoulder Patches',    body: { pathfinder: '', adventurer: '' } },
      'shoulder-cord':         { title: 'PF Shoulder Cords',   body: { pathfinder: '', adventurer: '' } },
      'yellow-scarf':          { title: 'PF Scarf',            body: { pathfinder: '', adventurer: '' } },
      'black-scarf-slide':     { title: 'Slide',               body: { pathfinder: '', adventurer: '' } },
      'black-tie':             { title: 'PF Men\'s/Boys Tie',  body: { pathfinder: '', adventurer: '' } },
      'black-bow-tie':         { title: 'PF Tuxedo Tie',       body: { pathfinder: '', adventurer: '' } },
      'sash':                  { title: 'PF Sash',             body: { pathfinder: '', adventurer: '' } },
      'left-pocket-pins':      { title: 'PF MG/Staff Pins',    body: { pathfinder: '', adventurer: '' } },
      'right-pocket-name-tag': { title: 'PF Name Tag',         body: { pathfinder: '', adventurer: '' } },
      'shirt':                 { title: 'PF Shirt',            body: { pathfinder: '', adventurer: '' } },
      'belt':                  { title: 'PF Belt',             body: { pathfinder: '', adventurer: '' } },
      'belt-buckle':           { title: 'PF Belt Buckle',      body: { pathfinder: '', adventurer: '' } },
      'pants':                 { title: 'PF Pants/Skirt',      body: { pathfinder: '', adventurer: '' } },
      'shoes':                 { title: 'Shoes/Socks',         body: { pathfinder: '', adventurer: '' } }
    };

    const viewbox = document.getElementById('uniform');
    const detailsTitle = document.getElementById('details-title');
    const detailsBody = document.getElementById('details-body');
    const divisionButtons = document.querySelectorAll('#division-buttons button');
    const uniformButtons = document.querySelectorAll('#uniform-buttons button');
    let division = 'pathfinder';
    let selectedId = null;

    function applyAdventurerColors(svg, shirtColor) {
      svg.querySelectorAll('[fill], [stroke]').forEach(el => {
        if (el.id === 'belt') return;
        if (el.getAttribute('fill')?.toLowerCase() === '#000000') {
          el.setAttribute('fill', '#080833');
        }
        if (el.getAttribute('stroke')?.toLowerCase() === '#000000') {
          el.setAttribute('stroke', '#080833');
        }
      });
      ['shirt', 'collar', 'shirt-placket', 'pockets'].forEach(id => {
        const el = svg.querySelector('#' + id);
        if (el) el.setAttribute('fill', shirtColor);
      });
      if (shirtColor === 'white') {
        const shirt = svg.querySelector('#shirt');
        if (shirt) {
          shirt.setAttribute('stroke', '#000000');
          shirt.setAttribute('stroke-width', '2');
        }
      }
    }

    async function loadUniform(button) {
      const file = button.dataset.svg;
      const label = button.textContent;
      const res = await fetch(file);
      if (!res.ok) {
        viewbox.textContent = 'Could not load ' + file;
        return;
      }
      const doc = new DOMParser().parseFromString(await res.text(), 'image/svg+xml');
      const svg = doc.documentElement;
      svg.querySelectorAll('script').forEach(el => el.remove());
      svg.setAttribute('aria-label', division + ' ' + label + ' uniform');
      if (division === 'adventurer') {
        applyAdventurerColors(svg, button.dataset.shirtColor);
      }
      Object.keys(parts).forEach(id => {
        const el = svg.querySelector('#' + id);
        if (el) el.classList.add('part');
      });
      viewbox.replaceChildren(document.importNode(svg, true));
      if (selectedId && viewbox.querySelector('#' + selectedId)) {
        selectPart(selectedId);
      } else {
        selectedId = null;
        detailsTitle.textContent = 'Select a uniform item';
        detailsBody.textContent = 'Click part of the uniform to see details here.';
      }
    }

    function selectPart(id) {
      viewbox.querySelectorAll('.part.selected').forEach(el => el.classList.remove('selected'));
      const el = viewbox.querySelector('#' + id);
      if (el) el.classList.add('selected');
      selectedId = id;
      detailsTitle.textContent = division === 'pathfinder'
        ? parts[id].title
        : 'ADV ' + parts[id].title.replace(/^PF /, '');
      detailsBody.textContent = parts[id].body[division];
    }

    viewbox.addEventListener('click', e => {
      const part = e.target.closest('.part');
      if (part) selectPart(part.id);
    });

    divisionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        divisionButtons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        division = btn.dataset.division;
        loadUniform(document.querySelector('#uniform-buttons button.active'));
      });
    });

    uniformButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        uniformButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadUniform(btn);
      });
    });

    loadUniform(document.querySelector('#uniform-buttons button.active'));
  </script>
</body>
</html>
